services:
  hub-router:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HR_PORT: "8080"
      HR_ONLINE_API_KEYS: "change-me-online-key"
      HR_LOCAL_API_KEYS: "change-me-local-key"
      HR_ADMIN_API_KEY: ""
      HR_QUEUE_MAX_SIZE: "10000"
      HR_REQUEST_TTL: "5m"
      HR_LONGPOLL_TIMEOUT: "30s"
      HR_WRITE_TIMEOUT: "35s"
      HR_RESULT_TTL: "10m"
      HR_LOG_LEVEL: "info"
      HR_LOG_FORMAT: "json"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
