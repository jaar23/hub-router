[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hub-router"
version = "0.1.0"
description = "Async Python SDK for hub-router middleware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
